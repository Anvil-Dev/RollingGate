name: Pull Request Check
on:
  workflow_dispatch:
  pull_request:
    branches:
      - releases/**
    paths:
      - src/**
      - common/**
      - fabric/**
      - forge/**
      - build.gradle
      - gradle.properties
      - settings.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_BUILD: true
      PR_BUILD: true
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Read Properties
        id: 'properties'
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name java_version minecraft_version'

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew build

      - name: Get Version
        id: version
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '${{ steps.properties.outputs.mod_id }}-*-mc${{ steps.properties.outputs.minecraft_version }}.jar' -print -quit)
          MESSAGE=${JAR##*/}
          MESSAGE=${MESSAGE#${{ steps.properties.outputs.mod_id }}-}
          MESSAGE=${MESSAGE%-mc${{ steps.properties.outputs.minecraft_version }}.jar}
          echo "version=$MESSAGE" >> $GITHUB_OUTPUT

      - name: capture build artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ steps.properties.outputs.mod_name }} ${{ steps.version.outputs.version }}"
          path: build/libs/${{ steps.properties.outputs.mod_id }}-${{ steps.version.outputs.version }}-mc${{ steps.properties.outputs.minecraft_version }}.jar

      - name: gametest
        uses: Anvil-Dev/dedicated-server-launch-test@1.21.10-neoforge
        with:
          mod: build/libs/${{ steps.properties.outputs.mod_id }}-${{ steps.version.outputs.version }}-mc${{ steps.properties.outputs.minecraft_version }}.jar
